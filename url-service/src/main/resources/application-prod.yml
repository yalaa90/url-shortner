spring:
  config:
    activate:
      on-profile: prod

  datasource:
    leader:
      url: jdbc:postgresql://${DB_LEADER_HOST:localhost}:5432/urlshortener
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    follower:
      url: jdbc:postgresql://${DB_FOLLOWER_HOST:localhost}:5432/urlshortener
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  aws:
    sqs:
      click-events-queue: ${SQS_CLICK_EVENTS_QUEUE}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    com.urlshortener: INFO
    org.springframework: WARN
