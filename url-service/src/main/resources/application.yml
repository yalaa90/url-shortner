server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: url-service

  datasource:
    leader:
      url: jdbc:postgresql://localhost:5432/urlshortener
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: url-leader-pool
        maximum-pool-size: 20
        minimum-idle: 5
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000
    follower:
      url: jdbc:postgresql://localhost:5432/urlshortener
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: url-follower-pool
        maximum-pool-size: 15
        minimum-idle: 5
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
    consumer:
      group-id: url-service-link-created
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.urlshortener.url.messaging"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.urlshortener.url.messaging.LinkCreatedEvent
        max.poll.records: 100

  cache:
    type: caffeine

app:
  url:
    base-url: http://localhost:8080
    code-pool-warm-size: 10000
    snowflake:
      worker-id-key: url:snowflake:worker-id
      max-worker-id: 1023

  kafka:
    link-created-topic: link-created-events
    link-created-dlq-topic: link-created-dlq
    consumer:
      batch-size: 500
      max-wait-ms: 200
      idempotency-ttl-hours: 24

  aws:
    endpoint-url: http://localhost:4566
    region: us-east-1
    sqs:
      click-events-queue: http://localhost:4566/000000000000/click-events

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: url-service

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.urlshortener: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
