spring:
  config:
    activate:
      on-profile: docker

  datasource:
    leader:
      url: jdbc:postgresql://postgres:5432/urlshortener?currentSchema=url_service
      username: postgres
      password: postgres
    follower:
      url: jdbc:postgresql://postgres:5432/urlshortener?currentSchema=url_service
      username: postgres
      password: postgres

  flyway:
    schemas: url_service
    create-schemas: true

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:9093

app:
  aws:
    endpoint-url: http://localstack:4566
    sqs:
      click-events-queue: http://localstack:4566/000000000000/click-events
