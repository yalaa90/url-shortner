replicaCount: 2

image:
  repository: 012345678901.dkr.ecr.us-east-1.amazonaws.com/url-shortener/analytics-service
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8082

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

probes:
  liveness:
    initialDelaySeconds: 40
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 5

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /actuator/prometheus
  prometheus.io/port: "8082"

existingSecret: url-shortener-secrets

config:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-rds.default.svc.cluster.local:5432/urlshortener
  SPRING_DATASOURCE_USERNAME: urlshortener_app
  SPRING_DATA_REDIS_HOST: redis.default.svc.cluster.local
  SPRING_DATA_REDIS_PORT: "6379"
  SQS_CLICK_EVENTS_QUEUE: url-shortener-click-events.fifo
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: ""

nodeSelector: {}
tolerations: []
affinity: {}