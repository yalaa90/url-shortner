grafana:
  adminPassword: admin
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: grafana-basic-auth
    hosts:
      - grafana.sho.rt
    tls:
      - secretName: grafana-sho-rt-tls
        hosts:
          - grafana.sho.rt
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc:3200
      isDefault: false
      editable: true
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 40GiB
    podMonitorSelector: {}
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
alertmanager:
  enabled: true
  config:
    global:
      slack_api_url: ""
    route:
      group_by: ["alertname", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: default
      routes:
        - matchers:
            - severity = "critical"
          receiver: critical
    receivers:
      - name: default
        slack_configs:
          - channel: "#ops"