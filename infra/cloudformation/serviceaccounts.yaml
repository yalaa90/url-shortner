# Kubernetes ServiceAccounts that map to the CloudFormation IRSA roles
# (see infra/cloudformation/templates/iam.yaml).
#
# The annotation arn uses placeholders:
#   <ACCOUNT_ID>  - your AWS account id (or copy the role ARNs from the stack Output -> IrsaRoles)
#   <ENVIRONMENT> - the Environment parameter you deployed with (dev / staging / prod)
#
# Apply after the CloudFormation root stack has completed:
#   _ENV=prod API_ACCOUNT=000000000000 && sed -e "s|<ACCOUNT_ID>|$API_ACCOUNT|g" \
#     -e "s|<ENVIRONMENT>|$_ENV|g" infra/cloudformation/serviceaccounts.yaml | kubectl apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: url-shortener
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: url-service
  namespace: url-shortener
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/url-shortener-<ENVIRONMENT>-url-service-sqs-publisher
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service
  namespace: url-shortener
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/url-shortener-<ENVIRONMENT>-analytics-service-sqs-consumer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: url-shortener
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/url-shortener-<ENVIRONMENT>-secrets-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: url-shortener
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/url-shortener-<ENVIRONMENT>-secrets-reader