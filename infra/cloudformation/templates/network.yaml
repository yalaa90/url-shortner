AWSTemplateFormatVersion: "2010-09-09"
Description: Nested stack - VPC, subnets, internet gateway, NAT gateways and route tables for the URL Shortener platform.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  Project:
    Type: String
    Default: url-shortener
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  Az1:
    Type: String
    Default: us-east-1a
  Az2:
    Type: String
    Default: us-east-1b
  Az3:
    Type: String
    Default: us-east-1c
  EnableNatGateway:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

Conditions:
  NatEnabled: !Equals [!Ref EnableNatGateway, "true"]

Resources:
  # ───────── VPC ─────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${Project}-${Environment}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${Project}-${Environment}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ───────── Public subnets ─────────
  PublicSubnet0:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az1
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-public-0" }]
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az2
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-public-1" }]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az3
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-public-2" }]

  # ───────── Private subnets ─────────
  PrivateSubnet0:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az1
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-private-0" }]
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az2
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-private-1" }]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az3
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-private-2" }]

  # ───────── Database subnets ─────────
  DatabaseSubnet0:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [6, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az1
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-db-0" }]
  DatabaseSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [7, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az2
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-db-1" }]
  DatabaseSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [8, !Cidr [!Ref VpcCidr, 8, 8]]
      AvailabilityZone: !Ref Az3
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-db-2" }]

  # ───────── Public routing ─────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-public-rt" }]

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation0:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet0, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }

  # ───────── NAT gateways (per AZ) ─────────
  NatEip0:
    Type: AWS::EC2::EIP
    Condition: NatEnabled
    Properties: { Domain: vpc }
  NatEip1:
    Type: AWS::EC2::EIP
    Condition: NatEnabled
    Properties: { Domain: vpc }
  NatEip2:
    Type: AWS::EC2::EIP
    Condition: NatEnabled
    Properties: { Domain: vpc }

  NatGateway0:
    Type: AWS::EC2::NatGateway
    Condition: NatEnabled
    Properties:
      AllocationId: !GetAtt NatEip0.AllocationId
      SubnetId: !Ref PublicSubnet0
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: NatEnabled
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: NatEnabled
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2

  # ───────── Private routing (per AZ) ─────────
  PrivateRouteTable0:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-private-rt-0" }]
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-private-rt-1" }]
  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-${Environment}-private-rt-2" }]

  PrivateRoute0:
    Type: AWS::EC2::Route
    Condition: NatEnabled
    DependsOn: NatGateway0
    Properties:
      RouteTableId: !Ref PrivateRouteTable0
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway0
  PrivateRoute1:
    Type: AWS::EC2::Route
    Condition: NatEnabled
    DependsOn: NatGateway1
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1
  PrivateRoute2:
    Type: AWS::EC2::Route
    Condition: NatEnabled
    DependsOn: NatGateway2
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  PrivateSubnetRouteTableAssociation0:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet0, RouteTableId: !Ref PrivateRouteTable0 }
  PrivateSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable1 }
  PrivateSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable2 }
  DatabaseSubnetRouteTableAssociation0:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DatabaseSubnet0, RouteTableId: !Ref PrivateRouteTable0 }
  DatabaseSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DatabaseSubnet1, RouteTableId: !Ref PrivateRouteTable1 }
  DatabaseSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DatabaseSubnet2, RouteTableId: !Ref PrivateRouteTable2 }

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${Project}-${Environment}-vpc-id" }
  PublicSubnets:
    Value: !Join [",", [!Ref PublicSubnet0, !Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export: { Name: !Sub "${Project}-${Environment}-public-subnets" }
  PrivateSubnets:
    Value: !Join [",", [!Ref PrivateSubnet0, !Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export: { Name: !Sub "${Project}-${Environment}-private-subnets" }
  DatabaseSubnets:
    Value: !Join [",", [!Ref DatabaseSubnet0, !Ref DatabaseSubnet1, !Ref DatabaseSubnet2]]
    Export: { Name: !Sub "${Project}-${Environment}-database-subnets" }