        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 30 images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 30 },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  UrlServiceRepositoryUri:
    Value: !GetAtt UrlServiceRepo.RepositoryUri
  AnalyticsServiceRepositoryUri:
    Value: !GetAtt AnalyticsServiceRepo.RepositoryUri
  UserServiceRepositoryUri:
    Value: !GetAtt UserServiceRepo.RepositoryUri
