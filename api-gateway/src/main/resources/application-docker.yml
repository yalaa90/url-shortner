spring:
  config:
    activate:
      on-profile: docker

  cloud:
    gateway:
      routes:
        - id: url-service
          uri: http://url-service:8081
          predicates:
            - Path=/api/v1/links/**
          filters:
            - name: CircuitBreaker
              args:
                name: urlServiceCB
                fallbackUri: forward:/fallback/url-service
        - id: analytics-service
          uri: http://analytics-service:8082
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: CircuitBreaker
              args:
                name: analyticsServiceCB
                fallbackUri: forward:/fallback/analytics-service
        - id: user-service
          uri: http://user-service:8083
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
        - id: auth-service
          uri: http://user-service:8083
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCB
                fallbackUri: forward:/fallback/auth-service
        - id: url-redirect
          uri: http://url-service:8081
          predicates:
            - Path=/{code}
          filters:
            - SetPath=/api/v1/links/{code}

  data:
    redis:
      host: redis
      port: 6379
