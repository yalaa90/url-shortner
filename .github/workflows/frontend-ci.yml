name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "url-shortener-ui/**"
  pull_request:
    branches: [main]
    paths:
      - "url-shortener-ui/**"

jobs:
  build:
    name: Lint, test & build Angular app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: url-shortener-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: url-shortener-ui

      - name: Build (production)
        run: npm run build
        working-directory: url-shortener-ui

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: url-shortener-ui/dist/url-shortener-ui
          retention-days: 7

  publish:
    name: Build frontend image & push to ECR
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012345678901:role/github-actions-eks
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/url-shortener/frontend"
          docker build -f Dockerfile -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"